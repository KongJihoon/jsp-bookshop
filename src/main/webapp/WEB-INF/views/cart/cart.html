<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니 | BookShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<header class="border-bottom">
    <div class="container py-4">
        <a href="/" class="fs-3 fw-bold text-primary text-decoration-none">BookShop</a>
    </div>
</header>

<main class="bg-light py-5">
    <div class="container">

        <div class="mb-4">
            <h2 class="fw-bold mb-1">장바구니</h2>
            <p class="text-muted mb-0">주문할 상품과 수량을 확인해주세요.</p>
        </div>

        <div class="row g-4">

            <!-- 장바구니 상품 목록 -->
            <div class="col-lg-8">

                <div class="card border-0 shadow-sm rounded-4 mb-3">
                    <div class="card-body p-4">

                        <div class="d-flex gap-4">

                            <!-- 상품 이미지 -->
                            <div class="border rounded-4 bg-white d-flex align-items-center justify-content-center"
                                 style="width: 120px; height: 160px; overflow: hidden;">
                                <img src="/images/sample-book.jpg"
                                     alt="도서 이미지"
                                     class="img-fluid"
                                     style="width: 100%; height: 100%; object-fit: cover;">
                            </div>

                            <!-- 상품 정보 -->
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between gap-3">

                                    <div>
                                        <p class="text-primary small fw-semibold mb-1">IT·컴퓨터</p>
                                        <h5 class="fw-bold mb-2">자바의 정석</h5>
                                        <p class="text-muted small mb-3">남궁성 지음 · 도우출판</p>

                                        <p class="fw-bold mb-0">
                                            30,000원
                                        </p>
                                    </div>

                                    <button type="button"
                                            class="btn-close"
                                            aria-label="장바구니 상품 삭제">
                                    </button>
                                </div>

                                <!-- 수량 / 금액 -->
                                <div class="d-flex justify-content-between align-items-end mt-4">
                                    <div>
                                        <label for="quantity1" class="form-label small text-muted">수량</label>

                                        <div class="input-group" style="width: 130px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <input type="number"
                                                   id="quantity1"
                                                   class="form-control text-center"
                                                   value="2"
                                                   min="1">
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <p class="text-muted small mb-1">상품 금액</p>
                                        <strong class="fs-5 text-primary">60,000원</strong>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-3">
                    <div class="card-body p-4">

                        <div class="d-flex gap-4">

                            <div class="border rounded-4 bg-white d-flex align-items-center justify-content-center"
                                 style="width: 120px; height: 160px; overflow: hidden;">
                                <span class="text-muted small">도서 이미지</span>
                            </div>

                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between gap-3">

                                    <div>
                                        <p class="text-primary small fw-semibold mb-1">자기계발</p>
                                        <h5 class="fw-bold mb-2">성공하는 사람들의 습관</h5>
                                        <p class="text-muted small mb-3">스티븐 코비 지음 · 김영사</p>

                                        <p class="fw-bold mb-0">
                                            18,000원
                                        </p>
                                    </div>

                                    <button type="button"
                                            class="btn-close"
                                            aria-label="장바구니 상품 삭제">
                                    </button>
                                </div>

                                <div class="d-flex justify-content-between align-items-end mt-4">
                                    <div>
                                        <label for="quantity2" class="form-label small text-muted">수량</label>

                                        <div class="input-group" style="width: 130px;">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <input type="number"
                                                   id="quantity2"
                                                   class="form-control text-center"
                                                   value="1"
                                                   min="1">
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <p class="text-muted small mb-1">상품 금액</p>
                                        <strong class="fs-5 text-primary">18,000원</strong>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- 주문 요약 -->
            <div class="col-lg-4">

                <div class="card border-0 shadow-sm rounded-4 position-sticky"
                     style="top: 24px;">
                    <div class="card-body p-4">

                        <h5 class="fw-bold mb-4">주문 예상 금액</h5>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">상품 금액</span>
                            <span>78,000원</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">배송비</span>
                            <span>무료</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="fw-bold">총 결제 예정 금액</span>
                            <strong class="fs-4 text-primary">78,000원</strong>
                        </div>

                        <button type="button" class="btn btn-primary btn-lg w-100">
                            주문하기
                        </button>

                        <a href="/products" class="btn btn-light btn-lg w-100 mt-2">
                            쇼핑 계속하기
                        </a>

                    </div>
                </div>

            </div>

        </div>

    </div>
</main>

<footer class="border-top py-4">
    <div class="container text-muted small">
        BookShop
    </div>
</footer>

</body>
</html>
